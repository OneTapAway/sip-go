<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#4a3025">
<title>Sip & Go</title>
<style>
:root{--brown:#35170b;--beige:#f3e8d8;--cream:#fffdf9;--muted:#806c60;--line:#e3d3c1}
*{box-sizing:border-box}
body{margin:0;background:linear-gradient(180deg,#f8f1e8 0%,var(--beige) 100%);color:var(--brown);font-family:Arial,Helvetica,sans-serif}
main{min-height:100svh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:28px 22px 24px;text-align:center}
.brand{width:min(78vw,310px);height:auto;max-height:310px;margin:0 auto 26px;display:block;object-fit:contain}
.tagline{font-family:Georgia,serif;font-size:1.08rem;letter-spacing:.02em;margin:0 0 28px;color:var(--muted)}
.links{width:100%;max-width:390px;display:grid;gap:14px}
a{min-height:58px;padding:16px 20px;border-radius:16px;text-decoration:none;font-weight:700;font-size:1.05rem;display:flex;justify-content:center;align-items:center;gap:12px;transition:transform .15s,box-shadow .15s}
.primary{background:var(--brown);color:#fffdf9;box-shadow:0 5px 12px #35170b20}
.secondary{background:var(--cream);color:var(--brown);border:1px solid var(--line);box-shadow:0 3px 10px #35170b0b}
/* Prominent social buttons optimized for touch */
.links a:nth-child(1),.links a:nth-child(2){min-height:92px;padding:24px 20px;font-size:1.55rem;border-radius:18px;gap:18px}
.links a:nth-child(1) .icon,.links a:nth-child(2) .icon{width:40px;height:40px}
a:active{transform:scale(.985)}
.phone{margin-top:22px;color:var(--brown);font-size:.95rem}
.phone a{display:inline;min-height:0;padding:0;border-radius:0;text-decoration:underline;font-size:inherit}
footer{margin-top:30px;color:var(--muted);font-size:.72rem;letter-spacing:.12em;font-weight:700}
.icon{width:21px;height:21px;flex-shrink:0}
@media(min-height:800px){main{padding-top:40px;padding-bottom:32px}.brand{width:min(74vw,330px);margin-bottom:18px}.tagline{margin-bottom:34px}}
@media(max-width:360px){main{padding:22px 16px}.brand{width:min(78vw,275px)}.links a:nth-child(1),.links a:nth-child(2){min-height:82px;font-size:1.38rem}}
</style>

<style>
.brand-logo, img[alt*="Sip"], img[alt*="logo" i] {
  display:block; width:min(100%,300px); height:auto; object-fit:contain;
  background:transparent; margin:0 auto 18px;
}
</style>

<style>
.brand-logo, img[alt*="Sip"], img[alt*="logo" i] {
  display: block;
  width: min(88%, 340px);
  height: auto;
  max-height: 360px;
  object-fit: contain;
  background: transparent;
  margin: 0 auto 18px;
}
</style>
